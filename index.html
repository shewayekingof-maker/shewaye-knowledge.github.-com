<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shewaye Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🧠 Shewaye Quiz</h1>
    <p>500 የጠቅላላ እውቀት ጥያቄዎች</p>
</header>

<main class="quiz-container">

    <div class="top-bar">
        <span id="question-number">ጥያቄ 1 / 500</span>
        <span id="score">ነጥብ: 0</span>
    </div>

    <div class="progress">
        <div id="progress-bar"></div>
    </div>

    <div class="category" id="category">
        ጠቅላላ እውቀት
    </div>

    <h2 id="question">ጥያቄ እየጫነ ነው...</h2>

    <div id="answers" class="answers"></div>

    <button id="next-btn" class="next-btn">
        ቀጣይ ➜
    </button>

</main>

<div id="result" class="result hidden">

    <h2>🎉 ፈተናው ተጠናቋል!</h2>

    <p>ያገኘኸው ነጥብ</p>

    <div id="final-score">0 / 500</div>

    <p id="message"></p>

    <button onclick="restartQuiz()" class="restart-btn">
        🔄 እንደገና ሞክር
    </button>

</div>

<footer>
    <p>© 2026 Shewaye Quiz</p>
</footer>

<script src="quiz.js"></script>

</body>
</html>
