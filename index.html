<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shewaye Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🧠 Shewaye Quiz</h1>
        <p>General Knowledge Challenge</p>
    </header>

    <main class="quiz-container" id="quiz-box">
        <div class="top-bar">
            <span id="progress">Question 1 / 10</span>
            <span>Score: <span id="score-val">0</span></span>
        </div>

        <div class="progress">
            <div id="progress-bar"></div>
        </div>

        <div class="category" id="category">
            Science & Technology
        </div>

        <h2 id="question">Question loading...</h2>

        <div id="options" class="answers">
            <!-- Options will appear here -->
        </div>

        <button id="next-btn" class="next-btn" style="display: none;">
            Next ➔
        </button>
    </main>

    <!-- የ JavaScript ፋይሉን እዚህ ጋር እናያይዛለን -->
    <script src="quiz.js"></script>
    <footer>
        <p>© 2026 Shewaye Quiz</p>
    </footer>
</body>
</html>
